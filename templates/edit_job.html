<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Job - Job Scraper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/custom.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">
                            <i class="fas fa-edit me-2"></i>
                            Edit Job: {{ job.title }}
                        </h4>
                    </div>
                    <div class="card-body">
                        <form method="post">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="title" class="form-label">Job Title</label>
                                        <input type="text" class="form-control" id="title" name="title" value="{{ job.title }}" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="company" class="form-label">Company</label>
                                        <select class="form-select" id="company" name="company" required>
                                            {% for company in companies %}
                                                <option value="{{ company.id }}" {% if company.id == job.company.id %}selected{% endif %}>
                                                    {{ company.name }}
                                                </option>
                                            {% endfor %}
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="source_portal" class="form-label">Source Portal</label>
                                        <input type="text" class="form-control" id="source_portal" name="source_portal" value="{{ job.source_portal }}">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="job_link" class="form-label">Job Link</label>
                                        <input type="url" class="form-control" id="job_link" name="job_link" value="{{ job.job_link }}">
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="posted_date" class="form-label">Posted Date</label>
                                        <input type="date" class="form-control" id="posted_date" name="posted_date" value="{{ job.posted_date|date:'Y-m-d' }}">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="location" class="form-label">Location</label>
                                        <input type="text" class="form-control" id="location" name="location" value="{{ job.location }}">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <div class="mb-3">
                                        <label for="job_type" class="form-label">Job Type</label>
                                        <select class="form-select" id="job_type" name="job_type">
                                            <option value="">Select Job Type</option>
                                            <option value="remote" {% if job.job_type == 'remote' %}selected{% endif %}>Remote</option>
                                            <option value="full-time" {% if job.job_type == 'full-time' %}selected{% endif %}>Full-time</option>
                                            <option value="freelance" {% if job.job_type == 'freelance' %}selected{% endif %}>Freelance</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label">Keywords</label>
                                <div class="d-flex flex-wrap gap-2">
                                    {% for keyword in job.keywords.all %}
                                        <span class="badge bg-secondary">{{ keyword.word }}</span>
                                    {% empty %}
                                        <span class="text-muted">No keywords assigned</span>
                                    {% endfor %}
                                </div>
                            </div>
                            
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-save me-2"></i>Save Changes
                                </button>
                                <a href="{% url 'dashboard' %}" class="btn btn-secondary">
                                    <i class="fas fa-arrow-left me-2"></i>Back to Dashboard
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
</body>
</html>
